name: Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare release asset
        run: cp app/build/outputs/apk/release/app-release.apk TO-DO-v1.2.0.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.2.0 TO-DO-v1.2.0.apk --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit v1.2.0 --title "TO-DO v1.2.0" --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create v1.2.0 TO-DO-v1.2.0.apk --title "TO-DO v1.2.0" --notes-file release-notes.md --latest --repo "$GITHUB_REPOSITORY"
          fi
