plugins {
    id 'com.android.application'
}

android {
    namespace 'com.arsam92.todo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.arsam92.todo'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
